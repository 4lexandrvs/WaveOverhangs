name: Python plugin checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile plugin and tests
        run: python -m compileall -q plugin tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
